[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "property-rental-backend"
version = "0.1.0"
description = "FastAPI backend for Property Rental Management"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.16,<2",
  "argon2-cffi>=25.1,<26",
  "fastapi>=0.116,<1",
  "pydantic-settings>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "uvicorn[standard]>=0.35,<1",
  "cryptography>=50,<51",
  "qrcode>=8,<9",
]

[project.scripts]
property-rental-reservation-expiration = "property_rental.reservation_worker:main"
property-rental-scheduled-billing = "property_rental.billing_worker:main"

[project.optional-dependencies]
dev = [
  "build>=1.3,<2",
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pytest>=9.0.3,<10",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/property_rental"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
pretty = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = true
