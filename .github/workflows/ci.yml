name: CI

# V1-060: the free plan has 2,000 Actions minutes a month and one run takes about two hours,
# so CI runs on the shared branches, on pull requests and by hand, not on every work-branch push.
on:
  push:
    branches:
      - main
      - implementation/foundation
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # Lets a failed job cancel the rest of its run (below).
  actions: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality, tests, build, and traceability
    runs-on: ubuntu-latest
    # V1.1: the suite passed 60 minutes on 04/11/2026 once the ledger screens joined it.
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          # The token stays out of .git/config, so later steps cannot reuse it.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.15"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install locked backend dependencies
        working-directory: backend
        run: uv sync --locked --extra dev

      - name: Check backend formatting
        run: make backend-format-check

      - name: Lint backend
        run: make backend-lint

      - name: Type-check backend
        run: make backend-typecheck

      - name: Run backend, API, integration, and TEST-117 traceability tests
        run: make backend-test

      - name: Audit TEST-118 coverage for new material requirements
        env:
          TRACEABILITY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/traceability-audit.py --base "$TRACEABILITY_BASE"

      # V1-060: these two checks ran inside the removed OpenClaw step; they are not OpenClaw.
      - name: Validate the V1 roadmap and automation traceability
        run: |
          python3 scripts/validate-v1-roadmap.py
          python3 -m json.tool ops/AUTOMATION_TRACEABILITY.json >/dev/null

      - name: Build and import backend package
        run: make backend-build backend-import-check

      # V1-060 (owner 2026-10-25): when one job fails, stop the run's other jobs to save minutes.
      - name: Stop the other jobs after a failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}"

  frontend:
    name: Frontend quality, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        run: make frontend-install

      - name: Check frontend formatting
        run: make frontend-format-check

      - name: Lint frontend
        run: make frontend-lint

      - name: Type-check frontend
        run: make frontend-typecheck

      - name: Run frontend tests
        run: make frontend-test

      - name: Build frontend
        run: make frontend-build

      - name: Type-check the Telegram relay
        run: make relay-typecheck

      - name: Run Telegram relay tests
        run: make relay-test

      # V1-060 (owner 2026-10-25): when one job fails, stop the run's other jobs to save minutes.
      - name: Stop the other jobs after a failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}"

  dependency-security:
    name: Dependency security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.15"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Audit locked backend runtime dependencies
        working-directory: backend
        run: >-
          uv export --locked --no-dev --no-emit-project --format requirements-txt --no-hashes |
          uvx --from pip-audit==2.10.1 pip-audit -r /dev/stdin

      - name: Audit locked backend development dependencies
        working-directory: backend
        run: >-
          uv export --locked --extra dev --no-emit-project --format requirements-txt --no-hashes |
          uvx --from pip-audit==2.10.1 pip-audit -r /dev/stdin

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        run: make frontend-install

      - name: Audit locked frontend dependencies
        run: make frontend-audit

      # V1-060 (owner 2026-10-25): when one job fails, stop the run's other jobs to save minutes.
      - name: Stop the other jobs after a failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}"

  postgresql-migrations:
    name: PostgreSQL migration gate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.15"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install locked backend dependencies
        working-directory: backend
        run: uv sync --locked --extra dev

      - name: Run isolated PostgreSQL migration verification
        run: make database-test

      # V1-060 (owner 2026-10-25): when one job fails, stop the run's other jobs to save minutes.
      - name: Stop the other jobs after a failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}"
